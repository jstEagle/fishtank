[workspace]
members = [
    "crates/fishtank-cli",
    "crates/fishtank-core",
    "crates/fishtank-protocol",
    "crates/fishtank-server",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/openai/fishtank"

[workspace.dependencies]
anyhow = "=1.0.102"
axum = { version = "=0.8.9", features = ["json"] }
async-stream = "=0.3.6"
async-trait = "=0.1.89"
clap = { version = "=4.6.1", features = ["derive", "env"] }
fishtank-core = { path = "crates/fishtank-core" }
fishtank-protocol = { path = "crates/fishtank-protocol" }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
schemars = { version = "=1.2.1", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "migrate"] }
tempfile = "=3.23.0"
thiserror = "=2.0.18"
time = { version = "=0.3.47", features = ["formatting", "macros", "serde"] }
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread", "signal", "time", "fs"] }
tokio-stream = "=0.1.17"
tower-http = { version = "=0.6.10", features = ["cors", "trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
