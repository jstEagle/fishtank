overrides:
  semver@6.3.1: 7.8.0
  eslint-import-resolver-typescript: 4.4.4
  postcss@<8.5.10: 8.5.14
packages:
  - "."
  - "apps/*"
allowBuilds:
  canvas: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
savePrefix: ''
strictDepBuilds: true
blockExoticSubdeps: true
minimumReleaseAge: 1440
trustPolicy: no-downgrade
minimumReleaseAgeExclude:
  - postcss@8.5.10
